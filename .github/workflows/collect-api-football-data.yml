name: Collect supplementary API-Football data

on:
  schedule:
    - cron: '13 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: api-football-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Check optional configuration
        id: configured
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Collection awaits optional repository secret API_FOOTBALL_KEY. Existing providers continue normally.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.configured.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.configured.outputs.enabled == 'true'
        run: python -m pip install -r football_value_requirements.txt
      - name: Collect relevant fixture, result and statistics observations
        id: collect
        if: steps.configured.outputs.enabled == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set +e
          python collect_api_football_data.py --api-key-source environment --seasons 2024 2023 2022
          code=$?
          set -e
          echo "result=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Publish observations and durable request checkpoint
        if: steps.collect.outputs.result == '0' || steps.collect.outputs.result == '1'
        run: python publish_api_football_data.py
      - name: Summarize coverage
        if: steps.collect.outputs.result == '0' || steps.collect.outputs.result == '1'
        run: |
          echo 'API-Football remains supplementary. Partial/free-plan restricted coverage does not replace existing data.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('.football_cache/api_football/collection_status.json').read_text())
          fixtures = report.get('fixtures_collected', 0)
          message = f"Collection {report['status']}: {fixtures} fixtures from successful season queries; {report['statistics_saved']} statistics observations saved; {report['requests']} requests."
          if report['status'] != 'complete':
              print('::warning::'+message+' Review query reasons in the summary; workflow completion does not imply data coverage.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(message+'\n\n```json\n'+json.dumps(report, indent=2)+'\n```\n')
          PY
      - name: Retain recovery state
        if: always() && (failure() || cancelled()) && steps.collect.outcome != 'skipped' && steps.configured.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-football-recovery-${{ github.run_id }}
          path: .football_cache/api_football/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
