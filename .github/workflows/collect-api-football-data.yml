name: Collect supplementary API-Football data

on:
  schedule:
    - cron: '13 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: api-football-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Check optional configuration
        id: configured
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Collection awaits optional repository secret API_FOOTBALL_KEY. Existing providers continue normally.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.configured.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Guard unpublished quota after a failed run
        if: steps.configured.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/collect-api-football-data.yml/runs?branch=main&status=completed&per_page=10" > /tmp/api-football-previous-runs.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          runs = json.loads(Path('/tmp/api-football-previous-runs.json').read_text())['workflow_runs']
          runs = [r for r in runs if str(r['id']) != os.environ['GITHUB_RUN_ID']]
          if runs:
              previous = max(runs, key=lambda r: r['run_number'])
              started = datetime.fromisoformat(previous['created_at'].replace('Z', '+00:00'))
              if previous['conclusion'] in ('failure', 'cancelled', 'timed_out') and started.date() == datetime.now(timezone.utc).date():
                  path = Path('.football_cache/api_football/state/checkpoint.json')
                  state = json.loads(path.read_text()) if path.exists() else {}
                  last = float(state.get('settings', {}).get('last_request', 0))
                  if last < started.timestamp():
                      raise SystemExit('Previous collection may have unpublished quota. Restore the recovery artifact and commit its state, or wait for the next UTC day.')
          PY
      - name: Install dependencies
        if: steps.configured.outputs.enabled == 'true'
        run: python -m pip install -r football_value_requirements.txt
      - name: Collect relevant fixture, result and statistics observations
        id: collect
        if: steps.configured.outputs.enabled == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set +e
          python collect_api_football_data.py --api-key-source environment --daily-budget 80 --max-requests 20 --stats-limit 10
          code=$?
          set -e
          echo "result=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Publish observations and durable request checkpoint
        if: steps.collect.outputs.result == '0' || steps.collect.outputs.result == '1'
        run: python publish_api_football_data.py
      - name: Summarize coverage
        if: steps.collect.outputs.result == '0' || steps.collect.outputs.result == '1'
        run: |
          echo 'API-Football remains supplementary. Partial/free-plan restricted coverage does not replace existing data.' >> "$GITHUB_STEP_SUMMARY"
          cat .football_cache/api_football/collection_status.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain recovery state
        if: always() && (failure() || cancelled()) && steps.collect.outcome != 'skipped' && steps.configured.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: api-football-recovery-${{ github.run_id }}
          path: .football_cache/api_football/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
