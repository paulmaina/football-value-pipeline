name: Forward performance review

on:
  push:
    branches: [main]
    paths:
      - 'football_output_v2/raw/all_leagues_predictions.csv'
      - 'football_output_v2/raw/conservative_bet_shortlist.csv'
      - 'football_output_v2/raw/conservative_bet_summary.json'
      - '.github/workflows/forward-performance.yml'
      - 'publish_performance.py'
  schedule:
    # Daily review 07:30 UTC / 10:30 East Africa Time (approximate).
    # This covers domestic weekend matches and midweek UCL fixtures.
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      capture_current_snapshot:
        description: 'Archive currently committed forecasts if any fixtures are still pre-kickoff'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forward-performance-main
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the main branch with tracked forecasts
        uses: actions/checkout@v4
        with:
          # Preserve the exact commit that triggered a forecast-data push;
          # don't accidentally tag a later raw snapshot with an older SHA.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: football_value_requirements.txt

      - name: Install requirements
        run: pip install -r football_value_requirements.txt

      - name: Archive fresh committed forecasts before kickoff
        if: github.event_name == 'push' || inputs.capture_current_snapshot == true
        run: |
          # Code-only repairs must not manufacture a new forecast snapshot.
          if [ "$EVENT_NAME" = "push" ] && ! git diff --name-only "$BEFORE_SHA" "$SOURCE_SHA" -- \
            football_output_v2/raw/all_leagues_predictions.csv \
            football_output_v2/raw/conservative_bet_shortlist.csv \
            football_output_v2/raw/conservative_bet_summary.json | grep -q .; then
            echo "No forecast inputs changed; skipping capture."
            exit 0
          fi
          python performance_tracking.py capture --commit-sha "$SOURCE_SHA"
        env:
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}

      - name: Regenerate and publish reports from latest main
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python publish_performance.py

