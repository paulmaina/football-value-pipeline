name: Forward performance review

on:
  push:
    branches: [main]
    paths:
      - 'football_output_v2/raw/all_leagues_predictions.csv'
      - 'football_output_v2/raw/conservative_bet_shortlist.csv'
      - 'football_output_v2/raw/conservative_bet_summary.json'
      - 'football_output_v2/raw/goal_blend_experiment.json'
      - 'football_output_v2/raw/market_led_experiment.json'
      - 'football_output_v2/raw/filter_sensitivity_experiment.json'
      - 'football_output_v2/raw/benchmark_forward_experiment.json'
      - 'football_output_v2/performance/snapshots/**'
      - 'performance_tracking.py'
      - 'pipeline_health.py'
      - 'quote_policy.py'
      - 'shortlist_quote_policy.json'
      - 'ucl_training.py'
      - 'docs/ucl_training_refresh_status.json'
      - 'performance_excel.py'
      - 'performance_report_layout.py'
      - 'publish_performance.py'
      - 'workflow_checks.py'
      - 'goal_blend_experiment.py'
      - 'recency_experiment.py'
      - 'filter_sensitivity_experiment.py'
      - 'benchmark_forward_experiment.py'
      - 'benchmark_forward_registry.json'
      - 'totals_anchor_experiment.py'
      - 'totals_anchor_registry.json'
      - 'closing_odds.py'
      - 'football_output_v2/raw/totals_anchor_experiment.json'
      - 'football_output_v2/closing_odds/observations/**'
      - 'experiment_review_queue.py'
      - 'dc_decay_validation.py'
      - 'forecast_integrity.py'
      - '.gitattributes'
      - 'market_led_experiment.py'
      - 'match_scores.py'
      - 'api_key_config.py'
      - 'football_value_pipeline_v2_standalone.py'
      - 'football_value*requirements.txt'
      - 'assets/performance_report_template.xlsx'
      - '.github/workflows/forward-performance.yml'
  schedule:
    # Daily at approximately 10:30 EAT; dispatch manually for an earlier review.
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      capture_current_snapshot:
        description: Archive committed forecasts if they are still pre-kickoff
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forward-performance-main
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            football_value_requirements.txt
            football_value_dev_requirements.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r football_value_dev_requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Check Python modules and CLI entry points
        run: python workflow_checks.py smoke --output workflow_artifacts/smoke.json
      - name: Run complete offline regression suite before writing reports
        run: python run_offline_tests.py
      - name: Validate archived forecast integrity
        run: python workflow_checks.py archives --output workflow_artifacts/archive-check.json
      - name: Archive changed forecasts before kickoff
        if: github.event_name == 'push' || inputs.capture_current_snapshot == true
        run: python workflow_checks.py capture --event "$EVENT_NAME" --sha "$SOURCE_SHA" --before "$BEFORE_SHA" --output workflow_artifacts/capture.json
        env:
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
      - name: Check result-provider credential configuration
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python -c "import os; assert os.getenv('FOOTBALL_DATA_API_KEY', '').strip(), 'Configure the FOOTBALL_DATA_API_KEY repository secret for automatic verified results'"
      - name: Regenerate, validate and publish from latest main
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python publish_performance.py --api-key-source environment --validate-reports --artifact-dir workflow_artifacts
      - name: Retain review reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workflow_artifacts/
            football_output_v2/performance/snapshots/
          if-no-files-found: warn
          retention-days: 30

  notify:
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r football_value_requirements.txt
      - name: Notify ready experiment reviews once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python experiment_review_queue.py --notify-repository "$GITHUB_REPOSITORY"

