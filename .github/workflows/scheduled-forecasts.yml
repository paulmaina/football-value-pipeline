name: Scheduled forecast collection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-forecasts.yml'
      - 'publish_scheduled_forecasts.py'
      - 'benchmark_forward_registry.json'
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scheduled-forecast-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEY_FALLBACK_1: ${{ secrets.THE_ODDS_API_KEY_FALLBACK_1 }}
      THE_ODDS_API_KEY_FALLBACK_2: ${{ secrets.THE_ODDS_API_KEY_FALLBACK_2 }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check collection credentials
        id: credentials
        run: |
          python - <<'PY'
          import os
          available=any(os.getenv(k,'').strip() for k in ('THE_ODDS_API_KEY','THE_ODDS_API_KEY_FALLBACK_1','THE_ODDS_API_KEY_FALLBACK_2')) and bool(os.getenv('FOOTBALL_DATA_API_KEY','').strip())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready='+str(available).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Collection credentials ready.\n' if available else 'SETUP REQUIRED: configure at least one THE_ODDS_API_KEY secret and FOOTBALL_DATA_API_KEY. Local .env keys are unavailable to Actions. No forecasts generated.\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football_value_dev_requirements.txt
      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install -r football_value_dev_requirements.txt
      - name: Offline regression checks
        if: steps.credentials.outputs.ready == 'true'
        run: python run_offline_tests.py
      - name: Generate, capture, grade and publish on latest main
        if: steps.credentials.outputs.ready == 'true'
        run: python publish_scheduled_forecasts.py
      - name: Notify ready experiment reviews
        if: steps.credentials.outputs.ready == 'true'
        run: python experiment_review_queue.py --notify-repository "$GITHUB_REPOSITORY"
