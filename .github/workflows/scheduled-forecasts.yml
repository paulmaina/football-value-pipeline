name: Scheduled forecast collection

# One forecast run a day. A push no longer triggers a full run: each run costs
# up to ~300 Odds API credits, and push reruns doubled November's usage.
# Use workflow_dispatch to rerun on purpose.
on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-forecast-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEY_FALLBACK_1: ${{ secrets.THE_ODDS_API_KEY_FALLBACK_1 }}
      THE_ODDS_API_KEY_FALLBACK_2: ${{ secrets.THE_ODDS_API_KEY_FALLBACK_2 }}
      # Optional odds providers (odds_provider_config.json); an absent secret is an empty key, and that
      # provider is skipped. Read only when the provider switch is on.
      PINNAPI_API_KEY: ${{ secrets.PINNAPI_API_KEY }}
      PINNODDS_API_KEY: ${{ secrets.PINNODDS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check collection credentials
        id: credentials
        run: |
          python - <<'PY'
          import os
          available=any(os.getenv(k,'').strip() for k in ('THE_ODDS_API_KEY','THE_ODDS_API_KEY_FALLBACK_1','THE_ODDS_API_KEY_FALLBACK_2')) and bool(os.getenv('FOOTBALL_DATA_API_KEY','').strip())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready='+str(available).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Collection credentials ready.\n' if available else 'SETUP REQUIRED: configure at least one THE_ODDS_API_KEY secret and FOOTBALL_DATA_API_KEY. Local .env keys are unavailable to Actions. No forecasts generated.\n')
          PY
      - uses: actions/setup-python@v7
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: football_value_dev_requirements.txt
      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install -r football_value_dev_requirements.txt
      - name: Generate, capture, grade and publish on latest main
        id: publish
        if: steps.credentials.outputs.ready == 'true'
        run: python publish_scheduled_forecasts.py
      # After everything is published: a live forecast on a stale research fit (C6 or CE3n) ends the run red, so
      # GitHub emails the failure. The forecasts above are already on main (Paul, 23 Nov 2026).
      - name: Fail the run when a live forecast used a stale research fit
        if: steps.publish.outputs.stale_fit == 'true'
        env:
          STALE_FIT_WARNING: ${{ steps.publish.outputs.stale_fit_warning }}
        run: |
          echo "::error title=Stale research fit::$STALE_FIT_WARNING"
          echo "### Stale research fit: run marked failed (forecasts were published)" >> "$GITHUB_STEP_SUMMARY"
          echo "$STALE_FIT_WARNING" >> "$GITHUB_STEP_SUMMARY"
          exit 1
