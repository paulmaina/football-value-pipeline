name: Refresh live C6 and CE3n research fits

on:
  schedule:
    # Every day 17:05 UTC, after the 16:17 training refresh. Both scripts build whenever the committed fit
    # lacks the window holding today (a new window opens every second Monday), whatever the day, so a run
    # GitHub starts late (after midnight) or a refresh that failed is caught up by the next run. When the
    # window is already published they stop at once (nothing built, logged or committed). Since 23 Nov 2026;
    # before, they built only on the origin's own UTC day and the 16 Nov 2026 window was missed.
    - cron: '5 17 * * *'
  workflow_dispatch:
    inputs:
      any_day:
        description: Rebuild the current window even if the committed fit already holds it
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: research-c6-fits
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: football_value_requirements.txt
      - run: python -m pip install -r football_value_requirements.txt
      # Builds research_c6_live_fits.json from every result known before each fold origin, validates it
      # (training cache checked 12 hours after the origin, every earlier window kept, today's window present)
      # and commits it on latest main. Any failure leaves the committed fit in place; live forecasts then
      # carry the "stale fit" warning until a refresh succeeds. The harness's locked fits are never touched.
      # Each fit-day run appends one line to football_output_v2/model_activity/activity_log.jsonl (model_activity.py):
      # published (in the fit's commit), skipped or failed with the reason (in a commit of its own). Days whose
      # window is already published log and commit nothing.
      - name: Build, validate and publish the live fits
        id: c6
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.any_day == false }}
        run: |
          scheduled=
          if [ "$SCHEDULED" = "true" ]; then scheduled=--scheduled; fi
          python scripts/build_research_c6_fits.py $scheduled --publish
      - name: Report a failed C6 refresh
        if: failure() && steps.c6.outcome == 'failure'
        run: |
          {
            echo '### Live C6 research fits NOT refreshed'
            echo
            echo 'The previous fit stays in place. Live research v5 forecasts warn that the fit is stale until a'
            echo 'refresh succeeds: rerun this workflow (workflow_dispatch) once the training cache has the results.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Research v6 (CE3n, UCL/UEL; Paul's decision of 14 Nov 2026): builds research_ce3n_live_fits.json
      # (league-strength factors and domestic strengths from every result known before each fold origin,
      # holdout periods included) with the same publish conditions (domestic files, UCL and UEL training data
      # checked 12 hours after the origin, every earlier window kept, today's window present). Runs even if the
      # C6 refresh failed; a failure leaves the committed CE3n fit in place and live v6 forecasts warn that it
      # is stale. The harness's locked CE3n fits (research_ce3n_fits.json) are never touched.
      - name: Build, validate and publish the live CE3n fits
        id: ce3n
        if: success() || failure()
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.any_day == false }}
        run: |
          scheduled=
          if [ "$SCHEDULED" = "true" ]; then scheduled=--scheduled; fi
          python scripts/build_research_ce3n_fits.py $scheduled --publish
      - name: Report a failed CE3n refresh
        if: failure() && steps.ce3n.outcome == 'failure'
        run: |
          {
            echo '### Live CE3n research fits NOT refreshed'
            echo
            echo 'The previous fit stays in place. Live research v6 (UCL/UEL) forecasts warn that the CE3n fit is'
            echo 'stale until a refresh succeeds: rerun this workflow (workflow_dispatch) once the results are in.'
          } >> "$GITHUB_STEP_SUMMARY"
