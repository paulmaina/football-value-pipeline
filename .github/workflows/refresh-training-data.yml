name: Refresh league training data

on:
  schedule:
    # Every four hours, independently of prediction and grading workflows.
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: Refresh each league's registry history window instead of just the current season
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'refresh_training_data.py'
      - 'league_registry.py'
      - 'europa_training.py'
      - '.github/workflows/refresh-training-data.yml'

permissions:
  contents: write

concurrency:
  group: domestic-training-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Europa reconciliation needs pandas/requests; domestic CSVs use the stdlib.
      - run: python -m pip install -r football_value_requirements.txt
      - name: Registered leagues and refresh methods
        run: |
          { echo '```'; python league_registry.py; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Every registry league with a keyless refresh method (football-data.co.uk
      # CSVs and the reconciled Europa snapshot) refreshes and publishes here.
      - name: Download, validate and publish training cache
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          history=
          if [ "$EVENT_NAME" = "push" ] || [ "$FULL_HISTORY" = "true" ]; then
            history=--full-history
          fi
          python refresh_training_data.py $history --publish
