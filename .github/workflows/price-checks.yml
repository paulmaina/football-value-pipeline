name: Price checks (v27, off by default)

# Re-runs only odds collection (main request: h2h, spreads, totals) and v27
# selection on the stored forecast; no model refit and no per-event requests.
# Disabled until approved: set the repository variable PRICE_CHECKS_ENABLED to
# 'true' and PRICE_CHECK_INTERVAL_HOURS to 3, 4 or 6. The job fires hourly and
# price_check.py exits unless the hour matches the interval, and makes no
# request when no stored fixture kicks off within 48 hours.
# Estimated monthly credits: `python price_check.py --estimate`.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-forecast-collection
  cancel-in-progress: false

jobs:
  check:
    if: vars.PRICE_CHECKS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEY_FALLBACK_1: ${{ secrets.THE_ODDS_API_KEY_FALLBACK_1 }}
      THE_ODDS_API_KEY_FALLBACK_2: ${{ secrets.THE_ODDS_API_KEY_FALLBACK_2 }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football_value_dev_requirements.txt
      - name: Install dependencies
        run: python -m pip install -r football_value_dev_requirements.txt
      - name: Refresh odds and re-rank
        run: python price_check.py --api-key-source environment --interval-hours "${{ vars.PRICE_CHECK_INTERVAL_HOURS || '4' }}"
      - name: Publish the refreshed shortlist
        run: |
          git add football_output_v2/raw football_output_v2/readable
          if git diff --cached --quiet; then echo 'No new price-check run.'; exit 0; fi
          bot="-c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com"
          git $bot commit -m 'Price check: refresh v27 shortlist'
          # Capture the run like scheduled forecasts do, so its picks are graded.
          python performance_tracking.py capture --commit-sha "$(git rev-parse HEAD)"
          git add football_output_v2/performance
          git diff --cached --quiet || git $bot commit -m 'Capture price-check shortlist'
          # Odds use a temporary cache, so no tracked file may remain modified here.
          if ! git diff --quiet; then echo 'Unexpected tracked changes:'; git diff --stat; exit 1; fi
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
