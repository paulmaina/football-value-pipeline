name: Collect complementary football data

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bbs-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check collection configuration
        id: configured
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: |
          if [ -n "$BBS_API_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Collection awaits repository secret BBS_API_KEY.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.configured.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Restore latest collected observations
        id: restore
        if: steps.configured.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p football_data_db
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bbs-data-state&per_page=100" > /tmp/bbs-artifacts.json
          python - <<'PY'
          import json, os, sqlite3, subprocess, zipfile
          from pathlib import Path
          artifacts = json.loads(Path('/tmp/bbs-artifacts.json').read_text())['artifacts']
          candidates = [a for a in artifacts if a['workflow_run']['head_branch'] == 'main']
          if candidates:
              artifact = max(candidates, key=lambda a: a['id'])
              if artifact['expired']:
                  raise SystemExit('Previous BBS state expired: restore a backup before resuming collection.')
              with open('/tmp/bbs-state.zip', 'wb') as handle:
                  subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact['id']}/zip"],stdout=handle,check=True)
              with zipfile.ZipFile('/tmp/bbs-state.zip') as archive:
                  Path('football_data_db/bbs.sqlite3').write_bytes(archive.read('bbs.sqlite3'))
              with sqlite3.connect('football_data_db/bbs.sqlite3') as db:
                  if db.execute('PRAGMA integrity_check').fetchone()[0] != 'ok':
                      raise SystemExit('Restored BBS state failed SQLite integrity check')
          else:
              print('No retained main-branch BBS artifact found; starting a new observation store.')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install runtime dependencies
        if: steps.restore.outputs.ready == 'true'
        run: python -m pip install -r football_value_requirements.txt
      - name: Collect and reconcile data
        if: steps.restore.outputs.ready == 'true'
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: python collect_bbs_data.py --api-key-source environment
      - name: Retain observation history, including partial runs
        if: always() && steps.restore.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bbs-data-state
          path: football_data_db/bbs.sqlite3
          if-no-files-found: warn
          retention-days: 90
      - name: Retain integrated data and quality reports
        if: always() && steps.restore.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bbs-enriched-data
          path: football_data_db/enriched/
          if-no-files-found: warn
          retention-days: 30
