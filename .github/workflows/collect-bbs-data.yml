name: Collect complementary football data

on:
  schedule:
    # 09:43, 17:43 and 01:43 EAT. Provider allowance controls collection.
    - cron: '43 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bbs-data-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Check collection configuration
        id: configured
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: |
          if [ -n "$BBS_API_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Collection awaits repository secret BBS_API_KEY.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.configured.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        if: steps.configured.outputs.enabled == 'true'
        run: python -m pip install -r football_value_requirements.txt
      - name: Collect and reconcile data
        id: collect
        if: steps.configured.outputs.enabled == 'true'
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: |
          set +e
          python collect_bbs_data.py --api-key-source environment
          code=$?
          set -e
          echo "result=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Publish validated files alongside existing training data
        if: steps.collect.outputs.result == '0' || steps.collect.outputs.result == '1'
        run: python publish_bbs_data.py
      - name: Report incomplete collection
        if: steps.collect.outputs.result == '1'
        run: echo 'Partial collection published with coverage/errors recorded. Provider-limited backfill resumes when allowance becomes available.' >> "$GITHUB_STEP_SUMMARY"
      - name: Recovery copy if publication or collection fails
        if: always() && (failure() || cancelled()) && steps.collect.outcome != 'skipped' && steps.configured.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bbs-recovery-${{ github.run_id }}
          path: .football_cache/bbs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
