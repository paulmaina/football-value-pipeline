name: Pipeline self-test

on:
  push:
    branches:
      - feature/**
      - main
  pull_request:
    branches:
      - main

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r football_value_requirements.txt

      - name: Compile pipeline
        run: python -m py_compile football_value_pipeline_v2_standalone.py

      - name: Run offline self-test
        run: python football_value_pipeline_v2_standalone.py --self-test
